# card.vantis.sh — Vantis Cards (bun app on 127.0.0.1:8240).
# Behind Cloudflare (orange cloud, SSL mode Full): self-signed origin cert.

server {
    listen 80;
    listen [::]:80;
    server_name card.vantis.sh;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name card.vantis.sh;

    # Cloudflare-only origin ($cf_origin_ok set in conf.d/cloudflare-allow.conf)
    if ($cf_origin_ok = 0) { return 403; }

    ssl_certificate /etc/nginx/ssl/card.vantis.sh.crt;
    ssl_certificate_key /etc/nginx/ssl/card.vantis.sh.key;

    client_max_body_size 2m;

    location = /robots.txt {
        alias /etc/nginx/vantis-shield-robots.txt;
    }

    # Never serve dot-paths (/.git, /.env, ...)
    location ~ /\.(?!well-known) { deny all; }

    # API surface: no UA shield — OpenAI-style clients and agents MUST reach
    # /v1/*; keys are the gate there. Rate caps still apply.
    location /v1/ {
        # Authenticated API clients can legitimately fan out many agent
        # workers behind one NAT. The application still enforces per-key RPM,
        # balance holds, and the shared upstream ceiling.
        limit_req zone=shield_perip burst=500 nodelay;
        limit_req_status 429;
        limit_conn shield_conn 512;
        limit_conn_status 429;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=15768000" always;

        proxy_pass http://127.0.0.1:8240;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        # AI-agent & scraper UA guard on the human-facing pages
        if ($shield_ua_ai) { return 403; }
        if ($shield_block_tool) { return 403; }
        limit_req zone=shield_perip burst=200 nodelay;
        limit_req_status 429;
        limit_conn shield_conn 30;
        limit_conn_status 429;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15768000" always;

        proxy_pass http://127.0.0.1:8240;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $remote_addr;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }
}
